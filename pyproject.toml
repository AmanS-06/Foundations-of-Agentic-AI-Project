[project]
name = "zeroplate"
version = "0.1.0"
description = "Cross-domain agentic AI canteen planner (CA-3, Foundations of Agentic AI)"
requires-python = ">=3.11,<3.12"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
