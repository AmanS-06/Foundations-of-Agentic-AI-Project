<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="860" viewBox="0 0 1900 860">
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; }
.t { font-size: 32px; font-weight: 700; }
.b { font-size: 25px; fill: #1B2B26; }
</style>
</defs>
<rect width="1900" height="860" fill="#FFFFFF"/>
<rect x="40" y="20" width="360" height="135" rx="16" fill="#F0F2F1" stroke="#5B6B66" stroke-width="3"/>
<text x="60" y="62" class="t" fill="#5B6B66">Streamlit app</text>
<text x="60" y="102" class="b">Manager picks a date,</text>
<text x="60" y="134" class="b">a goal and a note</text>
<rect x="470" y="20" width="360" height="135" rx="16" fill="#FBE4E1" stroke="#C0392B" stroke-width="3"/>
<text x="490" y="62" class="t" fill="#C0392B">Input guardrail</text>
<text x="490" y="102" class="b">Flags notes that</text>
<text x="490" y="134" class="b">try to give orders</text>
<rect x="1040" y="20" width="820" height="135" rx="16" fill="#EEE8F6" stroke="#6B4FA3" stroke-width="3"/>
<text x="1060" y="62" class="t" fill="#6B4FA3">Language model (replayed answers)</text>
<text x="1060" y="102" class="b">Reads the note, writes explanations and feedback.</text>
<text x="1060" y="134" class="b">Every number comes from a tool, never the model.</text>
<path d="M400,87 L470,87" fill="none" stroke="#5B6B66" stroke-width="3" marker-end="url(#head)"/>
<path d="M650,155 L650,190 L205,190 L205,228" fill="none" stroke="#5B6B66" stroke-width="3" marker-end="url(#head)"/>
<rect x="40" y="230" width="330" height="160" rx="16" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="60" y="272" class="t" fill="#1E7A55">1  Planner</text>
<text x="60" y="312" class="b">Splits the goal</text>
<text x="60" y="344" class="b">into tasks</text>
<rect x="410" y="230" width="330" height="160" rx="16" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="430" y="272" class="t" fill="#1E7A55">2  Research</text>
<text x="430" y="312" class="b">Gathers facts and</text>
<text x="430" y="344" class="b">rules, with sources</text>
<rect x="780" y="230" width="330" height="160" rx="16" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="800" y="272" class="t" fill="#1E7A55">3  Executor</text>
<text x="800" y="312" class="b">Forecasts, tries four</text>
<text x="800" y="344" class="b">plans, picks the best</text>
<rect x="1150" y="230" width="330" height="160" rx="16" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="1170" y="272" class="t" fill="#1E7A55">4  Critic</text>
<text x="1170" y="312" class="b">Checks six rules and</text>
<text x="1170" y="344" class="b">can send a plan back</text>
<rect x="1520" y="230" width="330" height="160" rx="16" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="1540" y="272" class="t" fill="#1E7A55">5  Automation</text>
<text x="1540" y="312" class="b">Raises purchase orders,</text>
<text x="1540" y="344" class="b">writes the prep sheet</text>
<path d="M370,300 L410,300" fill="none" stroke="#5B6B66" stroke-width="3" marker-end="url(#head)"/>
<path d="M740,300 L780,300" fill="none" stroke="#5B6B66" stroke-width="3" marker-end="url(#head)"/>
<path d="M1110,300 L1150,300" fill="none" stroke="#5B6B66" stroke-width="3" marker-end="url(#head)"/>
<path d="M1480,300 L1520,300" fill="none" stroke="#5B6B66" stroke-width="3" marker-end="url(#head)"/>
<path d="M1315,230 L1315,200 L945,200 L945,230" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#head)"/>
<text x="1130.0" y="190" text-anchor="middle" font-size="24" font-style="italic" fill="#C0392B">revise, at most twice</text>
<rect x="1240" y="400" width="240" height="38" rx="19" fill="#FBE4E1" stroke="#C0392B" stroke-width="2.5"/>
<text x="1360" y="426" text-anchor="middle" font-size="22" fill="#C0392B">escalate to a person</text>
<rect x="40" y="470" width="1820" height="64" rx="16" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="3.5"/>
<text x="64" y="511" class="t" fill="#2F6F8F">MCP hub</text>
<text x="240" y="511" class="b">Every tool call goes through here. Each agent has an allowlist, and only Business Automation can change anything.</text>
<path d="M100,390 L100,470" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M470,390 L470,470" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M840,390 L840,470" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M1210,390 L1210,470" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M1580,390 L1580,470" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<rect x="40" y="600" width="330" height="170" rx="16" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="60" y="642" class="t" fill="#2F6F8F">Education server</text>
<text x="60" y="682" class="b">Academic office:</text>
<text x="60" y="714" class="b">calendar, attendance</text>
<rect x="410" y="600" width="330" height="170" rx="16" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="430" y="642" class="t" fill="#2F6F8F">Supply server</text>
<text x="430" y="682" class="b">Canteen store: stock,</text>
<text x="430" y="714" class="b">recipes, suppliers,</text>
<text x="430" y="746" class="b">leftovers, orders</text>
<rect x="780" y="600" width="330" height="170" rx="16" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="800" y="642" class="t" fill="#2F6F8F">Finance server</text>
<text x="800" y="682" class="b">Accounts office:</text>
<text x="800" y="714" class="b">budget, plan cost,</text>
<text x="800" y="746" class="b">waste-cost log</text>
<rect x="1150" y="600" width="330" height="170" rx="16" fill="#FDF1DC" stroke="#B7791F" stroke-width="3" stroke-dasharray="10 6"/>
<text x="1170" y="642" class="t" fill="#B7791F">Knowledge base</text>
<text x="1170" y="682" class="b">FSSAI rules and</text>
<text x="1170" y="714" class="b">policies, with</text>
<text x="1170" y="746" class="b">citations</text>
<rect x="1520" y="600" width="330" height="170" rx="16" fill="#FDF1DC" stroke="#B7791F" stroke-width="3" stroke-dasharray="10 6"/>
<text x="1540" y="642" class="t" fill="#B7791F">Memory</text>
<text x="1540" y="682" class="b">Past runs and the</text>
<text x="1540" y="714" class="b">lessons they left</text>
<path d="M205,534 L205,600" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M575,534 L575,600" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M945,534 L945,600" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M1315,534 L1315,600" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<path d="M1685,534 L1685,600" fill="none" stroke="#2F6F8F" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#head)"/>
<rect x="40" y="808" width="26" height="26" rx="6" fill="#E3F1E9" stroke="#1E7A55" stroke-width="2.5"/>
<text x="76" y="829" font-size="22" fill="#5B6B66">agent</text>
<rect x="191" y="808" width="26" height="26" rx="6" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="2.5"/>
<text x="227" y="829" font-size="22" fill="#5B6B66">department system</text>
<rect x="498" y="808" width="26" height="26" rx="6" fill="#FDF1DC" stroke="#B7791F" stroke-width="2.5"/>
<text x="534" y="829" font-size="22" fill="#5B6B66">local tool</text>
<rect x="714" y="808" width="26" height="26" rx="6" fill="#FBE4E1" stroke="#C0392B" stroke-width="2.5"/>
<text x="750" y="829" font-size="22" fill="#5B6B66">guardrail</text>
<rect x="917" y="808" width="26" height="26" rx="6" fill="#EEE8F6" stroke="#6B4FA3" stroke-width="2.5"/>
<text x="953" y="829" font-size="22" fill="#5B6B66">language model</text>
<rect x="1185" y="808" width="26" height="26" rx="6" fill="#F0F2F1" stroke="#5B6B66" stroke-width="2.5"/>
<text x="1221" y="829" font-size="22" fill="#5B6B66">interface</text>
</svg>
