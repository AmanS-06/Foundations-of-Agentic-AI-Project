<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<defs><marker id="h-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6F8F"/></marker><marker id="h-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E7A55"/></marker>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1B2B26; }
.t { font-size: 26px; font-weight: 700; }
.h { font-size: 30px; font-weight: 700; }
.b { font-size: 23px; }
.u { font-size: 23px; font-weight: 700; }
.s { font-size: 20px; }
.i { font-size: 20px; font-style: italic; }
</style></defs>
<rect width="1600" height="800" fill="#FFFFFF"/>
<rect x="20" y="15" width="700" height="585" rx="18" fill="#F8FAF9" stroke="#8FA39A" stroke-width="3.5"/>
<text x="40" y="50" class="t" text-anchor="start" fill="#5B6B66">HOST: the ZeroPlate app (one process)</text>
<rect x="40" y="75" width="300" height="100" rx="14" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="56" y="109" class="t" text-anchor="start" fill="#1E7A55">Agents + LangGraph</text>
<text x="56" y="139" class="s" text-anchor="start">the 5 agents; they ask for</text>
<text x="56" y="164" class="s" text-anchor="start">a tool by name</text>
<rect x="40" y="190" width="300" height="100" rx="14" fill="#EEE8F6" stroke="#6B4FA3" stroke-width="3"/>
<text x="56" y="224" class="t" text-anchor="start" fill="#6B4FA3">LLM</text>
<text x="56" y="254" class="s" text-anchor="start">local Mistral; its answers</text>
<text x="56" y="279" class="s" text-anchor="start">are replayed in the demo</text>
<rect x="40" y="305" width="300" height="100" rx="14" fill="#F0F2F1" stroke="#5B6B66" stroke-width="3"/>
<text x="56" y="339" class="t" text-anchor="start" fill="#5B6B66">Streamlit UI</text>
<text x="56" y="369" class="s" text-anchor="start">the manager picks a date,</text>
<text x="56" y="394" class="s" text-anchor="start">a goal and a note</text>
<path d="M340,125 L365,125" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="365" y="70" width="335" height="510" rx="14" fill="#F0F6FA" stroke="#2F6F8F" stroke-width="3"/>
<text x="381" y="104" class="t" text-anchor="start" fill="#2F6F8F">MCP client: MCPHub</text>
<text x="381" y="132" class="s" text-anchor="start" fill="#5B6B66">(hub.py)</text>
<rect x="381" y="150" width="303" height="75" rx="14" fill="#FBE4E1" stroke="#C0392B" stroke-width="3"/>
<text x="397" y="184" class="t" text-anchor="start" fill="#C0392B">Allowlist check</text>
<text x="397" y="214" class="s" text-anchor="start">may this agent use this tool?</text>
<rect x="381" y="250" width="303" height="62" rx="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="3"/>
<text x="397" y="277" class="t" text-anchor="start" fill="#2F6F8F">ClientSession</text>
<text x="397" y="302" class="s" text-anchor="start">for the education server</text>
<rect x="381" y="345" width="303" height="62" rx="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="3"/>
<text x="397" y="372" class="t" text-anchor="start" fill="#2F6F8F">ClientSession</text>
<text x="397" y="397" class="s" text-anchor="start">for the supply server</text>
<rect x="381" y="440" width="303" height="62" rx="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="3"/>
<text x="397" y="467" class="t" text-anchor="start" fill="#2F6F8F">ClientSession</text>
<text x="397" y="492" class="s" text-anchor="start">for the finance server</text>
<text x="381" y="530" class="i" text-anchor="start" fill="#5B6B66">If MCP cannot start, MCPHub</text>
<text x="381" y="555" class="i" text-anchor="start" fill="#5B6B66">calls the same functions in-process.</text>
<path d="M340,355 L365,355" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="1000" y="15" width="580" height="160" rx="14" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="1016" y="49" class="t" text-anchor="start" fill="#2F6F8F">Education server</text>
<text x="1016" y="75" class="s" text-anchor="start" fill="#5B6B66">edu_server.py, a FastMCP subprocess</text>
<text x="1016" y="107" class="s" text-anchor="start">tools: get_calendar_event, get_expected_attendance</text>
<text x="1016" y="132" class="s" text-anchor="start">resources: academic_calendar, calendar_summary</text>
<rect x="1000" y="195" width="580" height="215" rx="14" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="1016" y="229" class="t" text-anchor="start" fill="#2F6F8F">Supply server</text>
<text x="1016" y="255" class="s" text-anchor="start" fill="#5B6B66">supply_server.py, a FastMCP subprocess</text>
<text x="1016" y="287" class="s" text-anchor="start">tools: get_menu, get_history, get_recipes,</text>
<text x="1016" y="312" class="s" text-anchor="start">get_inventory, get_suppliers, get_leftover_batches</text>
<text x="1016" y="337" class="s" text-anchor="start">write tool: create_purchase_order</text>
<text x="1016" y="362" class="s" text-anchor="start">resource: supplier_catalog</text>
<rect x="1000" y="430" width="580" height="170" rx="14" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="1016" y="464" class="t" text-anchor="start" fill="#2F6F8F">Finance server</text>
<text x="1016" y="490" class="s" text-anchor="start" fill="#5B6B66">finance_server.py, a FastMCP subprocess</text>
<text x="1016" y="522" class="s" text-anchor="start">tools: get_daily_budget, cost_plan</text>
<text x="1016" y="547" class="s" text-anchor="start">write tool: log_waste_cost</text>
<text x="1016" y="572" class="s" text-anchor="start">resource: budget_policy</text>
<path d="M684,281 H830 V95 H1000" fill="none" stroke="#2F6F8F" stroke-width="3.5" marker-end="url(#h-blue)" marker-start="url(#h-blue)"/>
<path d="M684,376 H860 V302 H1000" fill="none" stroke="#2F6F8F" stroke-width="3.5" marker-end="url(#h-blue)" marker-start="url(#h-blue)"/>
<path d="M684,471 H890 V515 H1000" fill="none" stroke="#2F6F8F" stroke-width="3.5" marker-end="url(#h-blue)" marker-start="url(#h-blue)"/>
<text x="915" y="85" class="i" text-anchor="start" fill="#2F6F8F">stdio</text>
<text x="915" y="292" class="i" text-anchor="start" fill="#2F6F8F">stdio</text>
<text x="915" y="505" class="i" text-anchor="start" fill="#2F6F8F">stdio</text>
<text x="20" y="640" class="t" text-anchor="start">One tool call, step by step</text>
<rect x="20" y="660" width="205" height="112" rx="14" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="34" y="692" class="s" text-anchor="start" fill="#1E7A55">1 Executor asks</text>
<text x="34" y="720" class="s" text-anchor="start">for supply.</text>
<text x="34" y="746" class="s" text-anchor="start">get_menu</text>
<path d="M225,716 L247,716" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="247" y="660" width="205" height="112" rx="14" fill="#FBE4E1" stroke="#C0392B" stroke-width="3"/>
<text x="261" y="692" class="s" text-anchor="start" fill="#C0392B">2 Allowlist</text>
<text x="261" y="720" class="s" text-anchor="start">check: is this</text>
<text x="261" y="746" class="s" text-anchor="start">agent allowed?</text>
<path d="M452,716 L474,716" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="474" y="660" width="205" height="112" rx="14" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="488" y="692" class="s" text-anchor="start" fill="#2F6F8F">3 MCPHub picks</text>
<text x="488" y="720" class="s" text-anchor="start">the supply</text>
<text x="488" y="746" class="s" text-anchor="start">ClientSession</text>
<path d="M679,716 L701,716" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="701" y="660" width="205" height="112" rx="14" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="715" y="692" class="s" text-anchor="start" fill="#2F6F8F">4 stdio: a JSON</text>
<text x="715" y="720" class="s" text-anchor="start">message goes to</text>
<text x="715" y="746" class="s" text-anchor="start">the server process</text>
<path d="M906,716 L928,716" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="928" y="660" width="205" height="112" rx="14" fill="#E4EEF6" stroke="#2F6F8F" stroke-width="3"/>
<text x="942" y="692" class="s" text-anchor="start" fill="#2F6F8F">5 FastMCP server</text>
<text x="942" y="720" class="s" text-anchor="start">runs get_menu</text>
<text x="942" y="746" class="s" text-anchor="start">and replies</text>
<path d="M1133,716 L1155,716" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="1155" y="660" width="205" height="112" rx="14" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="1169" y="692" class="s" text-anchor="start" fill="#1E7A55">6 The result</text>
<text x="1169" y="720" class="s" text-anchor="start">goes back to</text>
<text x="1169" y="746" class="s" text-anchor="start">the agent</text>
<path d="M1360,716 L1382,716" fill="none" stroke="#5B6B66" stroke-width="2.5" marker-end="url(#h-grey)"/>
<rect x="1382" y="660" width="205" height="112" rx="14" fill="#E3F1E9" stroke="#1E7A55" stroke-width="3"/>
<text x="1396" y="692" class="s" text-anchor="start" fill="#1E7A55">7 Saved in the</text>
<text x="1396" y="720" class="s" text-anchor="start">trace: tool,</text>
<text x="1396" y="746" class="s" text-anchor="start">time, who</text>
</svg>
